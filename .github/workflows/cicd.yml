name: Flask CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          python -m unittest discover -s tests -v

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TOUGE_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.TOUGE_SSH_KNOWN_HOSTS }}
          SERVER_IP: ${{ secrets.TOUGE_SERVER_IP }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf "%s\n" "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy Flask application
        env:
          SERVER_IP: ${{ secrets.TOUGE_SERVER_IP }}
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=15 -i ~/.ssh/id_ed25519 -p 52620 root@"$SERVER_IP" << 'ENDSSH'
            set -e
            cd /root/flask-web-app
            GIT_TERMINAL_PROMPT=0 timeout 60 git pull origin main
            supervisorctl restart flask-web-app
            sleep 3
            supervisorctl status flask-web-app
            curl --fail http://127.0.0.1:5000/
          ENDSSH
